name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Nebula at the pinned commit
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/keepvaibin/nebula.git nebula
          git -C nebula checkout "$(cat nebula.commit)"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p lumalink
      - uses: actions/upload-artifact@v4
        with:
          name: lumalink-${{ matrix.os }}
          path: |
            target/release/lumalink
            target/release/lumalink.exe
          if-no-files-found: ignore
